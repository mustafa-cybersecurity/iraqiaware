name: Build Windows x64 EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Pinned to a known-good commit for reproducible dependency resolution.
          vcpkgGitCommitId: 4c7f0ec2c7f4f6b9b2b0408f2b1f6d4d9fbb40b6

      - name: Configure (Release x64)
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package executable
        shell: powershell
        run: |
          $artifactDir = "$env:GITHUB_WORKSPACE\artifact"
          $exe = Get-ChildItem "build" -Recurse -File -Filter "iraqiaware.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "iraqiaware.exe was not found under the build directory."
          }
          $buildOutput = $exe.Directory.FullName
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          Copy-Item $exe.FullName "$artifactDir\iraqiaware.exe" -Force
          if (Test-Path "$buildOutput\resources") {
            Copy-Item "$buildOutput\resources" "$artifactDir\resources" -Recurse -Force
          }
          if (Test-Path "$buildOutput\config") {
            Copy-Item "$buildOutput\config" "$artifactDir\config" -Recurse -Force
          }
          Get-ChildItem $buildOutput -File -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName $artifactDir -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iraqiaware-windows-x64
          path: artifact
          if-no-files-found: error
