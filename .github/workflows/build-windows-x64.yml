name: Build Windows x64 EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 4c7f0ec2c7f4f6b9b2b0408f2b1f6d4d9fbb40b6

      - name: Configure (Release x64)
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\artifact" -Force | Out-Null
          Copy-Item "build\x64\Release\iraqiaware.exe" "$env:GITHUB_WORKSPACE\artifact\iraqiaware.exe" -Force
          if (Test-Path "build\x64\Release\resources") {
            Copy-Item "build\x64\Release\resources" "$env:GITHUB_WORKSPACE\artifact\resources" -Recurse -Force
          }
          if (Test-Path "build\x64\Release\config") {
            Copy-Item "build\x64\Release\config" "$env:GITHUB_WORKSPACE\artifact\config" -Recurse -Force
          }
          Get-ChildItem "build\x64\Release" -File -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "$env:GITHUB_WORKSPACE\artifact" -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iraqiaware-windows-x64
          path: artifact
          if-no-files-found: error
